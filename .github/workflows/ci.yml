name: Viv-AI CI Test Matrix

on:
  push:
    branches: [ main, 'feat/*', 'phases/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] && grep -q '\[build-system\]' pyproject.toml; then pip install -e .; fi

      - name: Run tests with coverage
        run: |
          python -m pytest -v --cov=viv_ai --cov-report=xml --cov-report=term-missing tests/ || exit 1

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11' && github.event_name == 'push'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}-${{ runner.os }}
          path: coverage.xml
          retention-days: 5

  lint:
    name: Lint (ruff/flake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install lint tools
        run: |
          pip install ruff flake8 mypy

      - name: Run ruff check
        run: |
          if command -v ruff &> /dev/null; then ruff check src/ tests/ || true; fi
      
      - name: Basic import check with mypy (light)
        run: |
          python -m pip install vivisect 2>&1 >/dev/null || true
          if [ -d src ]; then python -c "import viv_ai.mcp.server" 2>&1 || true; fi
